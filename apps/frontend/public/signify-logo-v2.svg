<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="35%" stop-color="#7C3AED"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="sh" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8AFF8"/>
      <stop offset="100%" stop-color="#9B8AE8"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4B8FC"/>
      <stop offset="100%" stop-color="#A899F0"/>
    </linearGradient>
    <linearGradient id="glassMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D5CCFF"/>
      <stop offset="100%" stop-color="#B8AAFC"/>
    </linearGradient>
    <linearGradient id="glassPalm" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#C0B4F5"/>
      <stop offset="100%" stop-color="#A694E8"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <clipPath id="ic">
      <rect x="150" y="60" width="500" height="500" rx="112"/>
    </clipPath>
  </defs>

  <!-- ========== ICON ========== -->
  <rect x="150" y="60" width="500" height="500" rx="112" fill="url(#bg)"/>

  <g clip-path="url(#ic)">
    <ellipse cx="310" cy="150" rx="340" ry="250" fill="url(#sh)"/>

    <!-- Palm -->
    <rect x="270" y="345" width="260" height="148" rx="60" fill="url(#glassPalm)" opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="280" y="352" width="240" height="60" rx="30" fill="#FFFFFF" fill-opacity="0.08"/>

    <!-- Pinky -->
    <g transform="rotate(-22, 322, 280)">
      <rect x="296" y="188" width="50" height="140" rx="25" fill="url(#glass1)" opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
      <rect x="304" y="196" width="34" height="48" rx="17" fill="#FFFFFF" fill-opacity="0.1"/>
    </g>
    <!-- Ring -->
    <g transform="rotate(-10, 358, 258)">
      <rect x="333" y="152" width="50" height="168" rx="25" fill="url(#glass2)" opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1"/>
      <rect x="341" y="160" width="34" height="56" rx="17" fill="#FFFFFF" fill-opacity="0.1"/>
    </g>
    <!-- Middle -->
    <rect x="375" y="108" width="52" height="200" rx="26" fill="url(#glassMid)" opacity="0.75" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="383" y="116" width="36" height="68" rx="18" fill="#FFFFFF" fill-opacity="0.15"/>
    <!-- Index -->
    <g transform="rotate(10, 442, 265)">
      <rect x="417" y="158" width="50" height="162" rx="25" fill="url(#glass2)" opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1"/>
      <rect x="425" y="166" width="34" height="54" rx="17" fill="#FFFFFF" fill-opacity="0.1"/>
    </g>
    <!-- Thumb -->
    <g transform="rotate(28, 488, 308)">
      <rect x="463" y="225" width="48" height="120" rx="24" fill="url(#glass1)" opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
      <rect x="471" y="233" width="32" height="42" rx="16" fill="#FFFFFF" fill-opacity="0.08"/>
    </g>

    <!-- AI Eye -->
    <circle cx="400" cy="420" r="56" fill="url(#eyeGlow)"/>
    <circle cx="400" cy="420" r="38" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-opacity="0.75"/>
    <circle cx="400" cy="420" r="50" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 6"/>
    <circle cx="400" cy="420" r="16" fill="url(#cy)"/>
    <circle cx="400" cy="420" r="6" fill="#FFFFFF" fill-opacity="0.92"/>

    <path d="M370 398 A38 38 0 0 1 400 388" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.45" stroke-linecap="round"/>
    <path d="M430 442 A38 38 0 0 1 400 452" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.45" stroke-linecap="round"/>

    <circle cx="545" cy="115" r="5" fill="#22D3EE" fill-opacity="0.45"/>
    <circle cx="575" cy="165" r="3" fill="#C4B5FD" fill-opacity="0.4"/>
    <circle cx="215" cy="495" r="4" fill="#F472B6" fill-opacity="0.3"/>
  </g>

  <!-- ========== WORDMARK ========== -->
  <text x="400" y="685" text-anchor="middle" font-family="'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="600" letter-spacing="-2" fill="url(#wordGrad)">Signify</text>
  <text x="400" y="735" text-anchor="middle" font-family="'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="6" fill="#9CA3AF">AI SIGN LANGUAGE</text>
</svg>
