<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="35%" stop-color="#7C3AED"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.7"/>
    </linearGradient>
    <clipPath id="ic">
      <rect x="0" y="0" width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <g clip-path="url(#ic)">
    <!-- Light sheen -->
    <ellipse cx="180" cy="120" rx="320" ry="240" fill="url(#sh)"/>

    <!-- Palm -->
    <rect x="160" y="285" width="192" height="110" rx="46" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>

    <!-- Pinky -->
    <g transform="rotate(-22, 208, 224)">
      <rect x="188" y="148" width="38" height="112" rx="19" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.8"/>
    </g>
    <!-- Ring -->
    <g transform="rotate(-10, 240, 205)">
      <rect x="221" y="114" width="38" height="132" rx="19" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="0.8"/>
    </g>
    <!-- Middle -->
    <rect x="237" y="78" width="40" height="155" rx="20" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2"/>
    <!-- Index -->
    <g transform="rotate(10, 302, 210)">
      <rect x="283" y="118" width="38" height="128" rx="19" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="0.8"/>
    </g>
    <!-- Thumb -->
    <g transform="rotate(28, 338, 248)">
      <rect x="315" y="172" width="36" height="100" rx="18" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.8"/>
    </g>

    <!-- AI Eye -->
    <circle cx="256" cy="340" r="30" fill="none" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="256" cy="340" r="40" fill="none" stroke="#22D3EE" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="3 5"/>
    <circle cx="256" cy="340" r="12" fill="url(#cy)"/>
    <circle cx="256" cy="340" r="4.5" fill="#FFFFFF" fill-opacity="0.9"/>

    <!-- Scan arcs -->
    <path d="M232 322 A30 30 0 0 1 256 314" fill="none" stroke="#22D3EE" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round"/>
    <path d="M280 358 A30 30 0 0 1 256 366" fill="none" stroke="#22D3EE" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round"/>

    <!-- Particles -->
    <circle cx="408" cy="88" r="4" fill="#22D3EE" fill-opacity="0.4"/>
    <circle cx="432" cy="130" r="2.5" fill="#A78BFA" fill-opacity="0.3"/>
    <circle cx="130" cy="400" r="3" fill="#EC4899" fill-opacity="0.25"/>
  </g>
</svg>
