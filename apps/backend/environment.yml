name: signify-backend
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - ultralytics>=8.3.0
      - torch==2.12.0
      - torchvision==0.27.0
      - fastapi==0.136.0
      - starlette==0.52.1
      - anyio==4.13.0
      - uvicorn[standard]
      - python-multipart
      - pydantic-settings
      - pillow
      - numpy
      - opencv-python
      - PyJWT==2.15.1
      - cryptography
      - locust
  - pytest=9.0.3
  - pytest-cov
  - httpx
