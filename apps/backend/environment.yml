name: signify-backend
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - ultralytics>=8.3.0
      - torch>=2.0.0
      - torchvision>=0.15.0
      - fastapi
      - uvicorn[standard]
      - python-multipart
      - pydantic-settings
      - pillow
      - numpy
      - opencv-python
      - PyJWT==2.9.0
      - cryptography
      - locust
  - pytest
  - pytest-cov
  - httpx
