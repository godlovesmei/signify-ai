name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail the workflow when security audits find issues"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan committed history for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: ${{ !contains(github.event.pull_request.labels.*.name, 'security-strict') }}
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4

  backend-python-audit:
    runs-on: ubuntu-latest
    continue-on-error: ${{ (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'security-strict')) || (github.event_name == 'workflow_dispatch' && !inputs.strict) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniconda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: signify-backend
          environment-file: apps/backend/environment.yml
          auto-activate-base: false
          use-mamba: true

      - name: Install pip-audit
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit backend dependencies
        shell: bash -l {0}
        run: |
          # CVE-2025-3000 currently has no fixed torch release in PyPI advisory data.
          # The backend does not call torch.jit.script; remove this ignore when upstream publishes a fix.
          pip-audit --ignore-vuln CVE-2025-3000

  frontend-node-audit:
    runs-on: ubuntu-latest
    continue-on-error: ${{ (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'security-strict')) || (github.event_name == 'workflow_dispatch' && !inputs.strict) }}
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit frontend dependencies
        run: pnpm audit --prod --audit-level=high
