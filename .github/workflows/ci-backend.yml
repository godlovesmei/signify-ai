name: CI Backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - apps/backend/**
      - .github/workflows/ci-backend.yml

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniconda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: signify-backend
          environment-file: apps/backend/environment.yml
          auto-activate-base: false
          use-mamba: true

      - name: Validate backend dependency graph
        run: |
          python -m pip install --upgrade pip
          python -m pip check

      - name: Syntax smoke check (backend)
        run: |
          python -m compileall apps/backend

      - name: Run backend tests
        run: |
          cd apps/backend
          python -m pytest tests -q --maxfail=1 --strict-config --strict-markers -W error \
            --cov=app --cov-branch --cov-report=term-missing --cov-report=json:coverage.json
          python scripts/check_coverage.py coverage.json

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage.json
