services:
  backend:
    image: signify-ai-backend:local
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Keep local model swaps fast without mounting the full 2.4GB models tree.
      - ./models/exports/bisindo_yolo/best.pt:/app/models/exports/bisindo_yolo/best.pt:ro
    environment:
      PORT: "8000"
    env_file:
      - apps/backend/.env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
